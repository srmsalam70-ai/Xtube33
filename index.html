<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XTUBE33</title>
    <style>
        body { font-family: sans-serif; background: #0f0f0f; color: white; margin: 0; padding: 10px; }
        .container { max-width: 800px; margin: auto; }
        h1 { color: #ff0000; text-align: center; margin: 10px 0; }
        .video-card { background: #181818; border-radius: 10px; padding: 10px; margin-bottom: 20px; }
        
        .video-wrapper { position: relative; background: #000; border-radius: 10px; overflow: hidden; aspect-ratio: 16/9; }
        .video-wrapper iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
        
        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; justify-content: center; align-items: center; z-index: 20; }
        .overlay.active { display: flex; }
        .btn-continue { background: #ff0000; padding: 15px 30px; border: none; font-weight: bold; cursor: pointer; color: white; font-size: 16px; border-radius: 5px; }

        .stats { display: flex; justify-content: space-between; padding: 15px 0; color: #aaa; font-size: 14px; border-top: 1px solid #333; }
        .comment-section { color: #ddd; font-size: 14px; border-top: 1px solid #333; padding-top: 10px; }
        .comment-heading { font-weight: bold; color: white; margin-bottom: 8px; }
        .comment-item { margin-bottom: 8px; }
        .comment-user { color: #ff0000; font-weight: bold; }
        
        .video-list { margin-top: 20px; }
        .item { display: flex; align-items: center; gap: 15px; background: #181818; padding: 10px; margin-bottom: 10px; border-radius: 8px; cursor: pointer; }
        
        .thumb { width: 120px; height: 70px; background: #333; flex-shrink: 0; position: relative; overflow: hidden; border-radius: 4px; }
        .thumb img { width: 100%; height: 100%; object-fit: cover; }
    </style>
</head>
<body>

<div class="container">
    <h1>XTUBE33</h1>
    <div class="video-card">
        <div class="video-wrapper" id="player-container">
            <!-- প্রথম ভিডিওটি ডিফল্ট হিসেবে লোড হবে -->
            <iframe id="main-iframe" src="https://www.eporner.com/embed/obffjpOrXCf/?autoplay=1" allow="autoplay; fullscreen" allowfullscreen></iframe>
            <div class="overlay" id="main-overlay">
                <button class="btn-continue" onclick="resumeVideo()">Continue Watch</button>
            </div>
        </div>
        <div class="stats"><span>👍 1.5K</span> <span>💬 442</span> <span>👁️ 15K</span> <span>🔗 Share</span></div>
        <div class="comment-section">
            <div class="comment-heading">Comments</div>
            <div class="comment-item"><span class="comment-user">Sagor Ahmed:</span> Awesome video! Love the acting.</div>
            <div class="comment-item"><span class="comment-user">Rafsan Jani:</span> The quality is amazing and super clear!</div>
            <div class="comment-item"><span class="comment-user">Tania Sultana:</span> Love this content! Best channel ever.</div>
        </div>
    </div>

    <h3>More Videos</h3>
    <div class="video-list" id="video-list"></div>
</div>

<script>
    // আপনার দেওয়া ইপোর্নার ভিডিওগুলোর আইডি দিয়ে তালিকা তৈরি করা হলো
    const videos = [
        {id: 'obffjpOrXCf', desc: 'High definition professional video content part one.'},
        {id: 'FaZ196XxZwb', desc: 'Amazing scenes and clear quality entertainment.'},
        {id: 'JC2jw8obzCR', desc: 'Exclusive vertical mobile format trending video.'},
        {id: 'wilPTKrNY51', desc: 'Special featured clip with high engagement.'},
        {id: '3KKSOYvGbue', desc: 'Popular mobile friendly video stream.'},
        {id: '3fOTTpnoffL', desc: 'Cinematic experience with stunning resolution.'},
        {id: 'OP98Aaet3An', desc: 'Classic trending footage for viewers.'},
        {id: 'inxw86iASET', desc: 'Top rated full HD content collection.'},
        {id: 'uSpndSAIEbO', desc: 'Special selected video for your audience.'},
        {id: 'RRk6HACi7up', desc: 'Square format unique layout video stream.'},
        {id: 'LajuUIZsG3d', desc: 'Smooth playback high quality production.'},
        {id: 'mKqZBZmJnid', desc: 'Ultra 4K resolution top-tier featured video.'}
    ];

    const mainIframe = document.getElementById('main-iframe');
    const overlay = document.getElementById('main-overlay');
    let watchTimer;

    function startWatchTimer() {
        clearTimeout(watchTimer);
        watchTimer = setTimeout(() => {
            if (!overlay.classList.contains('watched')) {
                overlay.classList.add('active', 'watched');
            }
        }, 10000); // ১০ সেকেন্ড পর ওভারলে আসবে
    }

    startWatchTimer();

    function resumeVideo() {
        overlay.classList.remove('active');
        window.open('https://progressmagnify.com/uxbc0jzq?key=7389f3aaab27e89319b6c474fc4bf2e0', '_blank');
        
        // ব্যাক করে আসার পর বা বাটন ক্লিক করার পর ভিডিও রি-প্লে ট্রিগার করতে সোর্স রিফ্রেশ করা হলো
        let currentSrc = mainIframe.src;
        mainIframe.src = '';
        setTimeout(() => {
            mainIframe.src = currentSrc;
        }, 100);
    }

    // ব্রাউজার হিস্ট্রি বা ব্যাক বাটন হ্যান্ডেল করার জন্য
    window.addEventListener('pageshow', function(event) {
        if (event.persisted) {
            let currentSrc = mainIframe.src;
            mainIframe.src = '';
            mainIframe.src = currentSrc;
        }
    });

    const list = document.getElementById('video-list');
    videos.forEach(v => {
        const div = document.createElement('div');
        div.className = 'item';
        // ইপোর্নারের থাম্বনেইল লিংক স্ট্রাকচার ব্যবহার করা হয়েছে
        div.innerHTML = `<div class="thumb"><img src="https://static-eu-cdn.eporner.com/thumbs/static/${v.id}/337.jpg" onerror="this.src='https://via.placeholder.com/120x70/222/fff?text=Video'"></div><div style="color:#ccc; font-size:14px;">${v.desc}</div>`;
        div.onclick = () => { 
            mainIframe.src = `https://www.eporner.com/embed/${v.id}/?autoplay=1`;
            overlay.classList.remove('active', 'watched');
            startWatchTimer();
            window.scrollTo(0, 0); 
        };
        list.appendChild(div);
    });
</script>

</body>
</html>
